[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "aavz"
version = "0.0.9"
authors = [
  {name="Mark Keller"}
]
description = "Arrow as virtual Zarr"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
dependencies = [
    "zarr==3.1.1",
    "numpy>=2.0.0",
    "pandas",
    "umap-learn==0.5.5",
    "scikit-learn==1.7.1",
    "vega-datasets==0.9.0"
    'anndata>=0.11.4',
    'pyarrow==22.0.0',
]

[project.optional-dependencies]
dev = [
  'pytest>= 8.4.1',
  'jupyter',
  'jupyterlab',
  'marimo',
]


[tool.setuptools]
packages = ["aavz"]
package-dir = {"" = "src"}

[project.urls]
repository = "https://github.com/vitessce/easy_vitessce"
