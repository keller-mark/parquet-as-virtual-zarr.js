<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parquet as Virtual Zarr</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 0 auto; padding: 2rem; color: #222; }
    h1 { margin-bottom: 0.25rem; }
    .subtitle { color: #666; margin-bottom: 1.5rem; }
    #drop-zone {
      border: 2px dashed #aaa; border-radius: 8px; padding: 2rem; text-align: center;
      margin-bottom: 1rem; transition: border-color 0.2s, background 0.2s; cursor: pointer;
    }
    #drop-zone.drag-over { border-color: #2563eb; background: #eff6ff; }
    #drop-zone p { margin-top: 0.5rem; color: #888; }
    .file-inputs { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
    .file-inputs label {
      display: inline-block; padding: 0.5rem 1rem; border: 1px solid #ccc; border-radius: 4px;
      background: #f9f9f9; cursor: pointer; font-size: 0.9rem;
    }
    .file-inputs label:hover { background: #eee; }
    input[type="file"] { display: none; }
    #status { margin-bottom: 1rem; color: #555; min-height: 1.25rem; }
    #output {
      background: #f6f8fa; border: 1px solid #ddd; border-radius: 4px;
      padding: 1rem; overflow: auto; max-height: 70vh; font-size: 0.85rem;
      white-space: pre-wrap; word-break: break-all; display: none;
    }
    #chunk-table-container {
      display: none; overflow-x: auto; margin-top: 1.5rem; margin-bottom: 1.5rem;
    }
    #chunk-table-container table {
      border-collapse: collapse; font-size: 0.85rem; width: 100%;
    }
    #chunk-table-container th, #chunk-table-container td {
      border: 1px solid #ddd; padding: 0.35rem 0.6rem; text-align: left;
      white-space: nowrap;
    }
    #chunk-table-container th {
      background: #f0f0f0; font-weight: 600; position: sticky; top: 0;
    }
    #chunk-table-container tr:nth-child(even) td { background: #fafafa; }
  </style>
</head>
<body>
  <h1>Parquet as Virtual Zarr</h1>
  <p class="subtitle">Select or drop a <code>.parquet</code>, <code>.csv</code>, or <code>.tsv</code> file to view its virtual Zarr v3 <code>/zarr.json</code>. A directory containing a <code>.parquet</code> file can also be dropped.</p>

  <div id="drop-zone">
    <div class="file-inputs">
      <label>
        Choose a file
        <input type="file" id="file-input" accept=".parquet,.csv,.tsv">
      </label>
      <label>
        Choose a directory
        <input type="file" id="dir-input" webkitdirectory>
      </label>
    </div>
    <p>or drag &amp; drop a file or folder here</p>
  </div>

  <p id="status"></p>

  <h2 id="chunk-table-heading" style="display:none; margin-top:1.5rem;">First Row-Group</h2>
  <div id="chunk-table-container"></div>

  <pre id="output"></pre>

  <h2 id="consolidated-heading" style="display:none; margin-top:1.5rem;">Consolidated Metadata</h2>
  <pre id="consolidated-output" style="display:none; background:#f6f8fa; border:1px solid #ddd; border-radius:4px; padding:1rem; overflow:auto; max-height:70vh; font-size:0.85rem; white-space:pre-wrap; word-break:break-all;"></pre>

  <script type="module" src="./demo/main.js"></script>
</body>
</html>
